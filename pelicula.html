<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Película - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CINEMA</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cartelera.html">Cartelera</a></li>
      <li><a href="mis-entradas.html">Mis Entradas</a></li>
      <li><a href="mi-lista.html">Mi Lista</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-user-area"></div>
      <button class="nav-mobile-toggle">&#9776;</button>
    </div>
  </nav>

  <main class="page-content">
    <div class="detail-hero" id="detail-hero">
      <div class="detail-hero-bg" id="detail-hero-bg"></div>
    </div>

    <div class="container">
      <div class="detail-content" id="detail-content">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>

      <div id="trailer-section"></div>
      <div id="similar-section"></div>
      <div id="ratings-section" style="margin-top:3rem"></div>
    </div>
  </main>

  <div class="modal-overlay" id="rating-modal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Valorar Película</h3>
        <button class="modal-close" onclick="closeRatingModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="rating-input" id="rating-stars-input"></div>
        <div class="form-group">
          <label>Tu comentario</label>
          <textarea id="rating-comment" rows="3" style="width:100%;padding:0.8rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--on-background);font-family:var(--font-body);resize:vertical" placeholder="Comparte tu opinión..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeRatingModal()">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="submitRating()">Enviar Valoración</button>
      </div>
    </div>
  </div>

  <footer style="padding:2rem;text-align:center;color:var(--on-background-dim);font-size:0.8rem;border-top:1px solid rgba(255,255,255,0.05);margin-top:3rem;">
    <p>&copy; 2026 CINEMA PREMIUM. Todos los derechos reservados.</p>
  </footer>
<script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/pelicula.js"></script>
</body>
</html>
