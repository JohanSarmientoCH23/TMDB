<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">CINEMA</div>
      <h2 class="auth-title">Iniciar Sesión</h2>
      <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>

      <div class="auth-error" id="login-error"></div>

      <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </form>

      <div class="auth-link">
        ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
      </div>
      <div class="auth-link" style="margin-top:0.5rem">
        <a href="index.html">Volver al inicio</a>
      </div>
    </div>
  </div>
<script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
