<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funciones - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CINEMA</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cartelera.html">Cartelera</a></li>
      <li><a href="mis-entradas.html">Mis Entradas</a></li>
      <li><a href="mi-lista.html">Mi Lista</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-user-area"></div>
      <button class="nav-mobile-toggle">&#9776;</button>
    </div>
  </nav>

  <main class="page-content">
    <div class="container">
      <div id="movie-info" style="padding:2rem 0">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>

      <div class="section-header" style="margin-top:2rem">
        <div>
          <h2 class="section-title">Funciones Disponibles</h2>
          <p class="section-subtitle" id="functions-subtitle"></p>
        </div>
      </div>

      <div id="functions-list">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <footer style="padding:2rem;text-align:center;color:var(--on-background-dim);font-size:0.8rem;border-top:1px solid rgba(255,255,255,0.05);margin-top:2rem;">
    <p>&copy; 2026 CINEMA PREMIUM. Todos los derechos reservados.</p>
  </footer>
<script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.init();
    updateNavAuth();
    setupMobileNav();
    setupNavbarScroll();

    const movieId = parseInt(getParam('movieId'));
    let movieData = null;

    async function loadFunctions() {
      if (!movieId) {
        document.getElementById('functions-list').innerHTML = renderEmptyState('No se especifico una pelicula');
        return;
      }

      try {
        // Cargar datos de pelicula (con fallback si TMDB falla)
        let movie;
        try {
          movie = await TMDB.getMovieDetails(movieId);
        } catch (e) {
          movie = { id: movieId, title: 'Pelicula #' + movieId, poster_path: null, release_date: '', runtime: 0, vote_average: 0 };
        }
        movieData = movie;
        renderMovieInfo(movie);

        // Cargar funciones existentes
        let functions = API.getFunctionsByMovie(movieId);
        const rooms = API.getRooms();

        // Si no hay funciones, crear unas automaticamente
        if (functions.length === 0 && rooms.length > 0) {
          functions = generateFunctionsForMovie(movieId, rooms);
        }

        renderFunctionsList(functions, rooms);

      } catch (err) {
        console.error('Error loading functions:', err);
        document.getElementById('functions-list').innerHTML = renderEmptyState('Error al cargar funciones');
      }
    }

    // Generar funciones automaticas para cualquier pelicula
    function generateFunctionsForMovie(movieId, rooms) {
      const today = new Date();
      const times = ['14:00', '17:00', '20:00'];
      const prices = { standard: 12000, '3D': 15000, VIP: 22000 };
      const created = [];

      for (let dayOffset = 0; dayOffset < 3; dayOffset++) {
        const date = new Date(today);
        date.setDate(date.getDate() + dayOffset);
        const dateStr = date.toISOString().split('T')[0];

        rooms.forEach((room, idx) => {
          const time = times[idx % times.length];
          const price = prices[room.type] || 12000;
          const func = API.createFunction({
            movieId: Number(movieId),
            roomId: room.id,
            date: dateStr,
            time: time,
            price: price
          });
          created.push(func);

          // Crear asientos para esta funcion
          const seats = API.getSeats(room.id);
          seats.forEach(seat => {
            const rand = Math.random();
            let status = 'available';
            if (rand < 0.1) status = 'sold';
            else if (rand < 0.15) status = 'reserved';
            API.post('/functionSeats', { functionId: func.id, seatId: seat.id, status });
          });
        });
      }

      return created;
    }

    function renderMovieInfo(movie) {
      const poster = movie.poster_path ? TMDB.getPosterURL(movie.poster_path) : '';
      const year = movie.release_date ? new Date(movie.release_date).getFullYear() : '';
      const duration = TMDB.formatDuration(movie.runtime);
      const rating = TMDB.formatRating(movie.vote_average);

      let html = '<div style="display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap">';
      if (poster) {
        html += '<img src="' + poster + '" alt="' + movie.title + '" style="width:80px;border-radius:12px;object-fit:cover">';
      }
      html += '<div>';
      html += '<h1 style="font-family:var(--font-heading);font-size:1.5rem">' + movie.title + '</h1>';
      html += '<p style="color:var(--on-background-dim);font-size:0.9rem">' + year + (duration ? ' \u2022 ' + duration : '') + (rating !== 'N/A' ? ' \u2022 \u2605 ' + rating : '') + '</p>';
      html += '</div></div>';

      document.getElementById('movie-info').innerHTML = html;
    }

    function renderFunctionsList(functions, rooms) {
      const container = document.getElementById('functions-list');

      if (!functions.length) {
        container.innerHTML = renderEmptyState('No hay funciones disponibles para esta película');
        return;
      }

      const grouped = {};
      functions.forEach(f => {
        if (!grouped[f.date]) grouped[f.date] = [];
        grouped[f.date].push(f);
      });

      document.getElementById('functions-subtitle').textContent = `${functions.length} función${functions.length > 1 ? 'es' : ''} disponible${functions.length > 1 ? 's' : ''}`;

      let html = '';
      Object.keys(grouped).sort().forEach(date => {
        html += `<h3 style="font-family:var(--font-heading);font-size:1rem;margin:1.5rem 0 0.8rem;color:var(--primary)">${formatDate(date)}</h3>`;
        grouped[date].forEach(func => {
          const room = rooms.find(r => r.id === func.roomId);
          html += renderFunctionCard(func, room);
        });
      });

      container.innerHTML = html;
    }

    function selectFunction(functionId) {
      window.location.href = `asientos.html?functionId=${functionId}`;
    }

    loadFunctions();
  </script>
</body>
</html>
