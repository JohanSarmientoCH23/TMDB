<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CINEMA</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cartelera.html">Cartelera</a></li>
      <li><a href="mis-entradas.html">Mis Entradas</a></li>
      <li><a href="mi-lista.html">Mi Lista</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-user-area"></div>
      <button class="nav-mobile-toggle">&#9776;</button>
    </div>
  </nav>

  <main class="page-content">
    <div class="admin-layout">
      <aside class="admin-sidebar" id="admin-sidebar">
        <a class="admin-sidebar-link active" data-section="dashboard" onclick="switchSection('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="admin-sidebar-link" data-section="functions" onclick="switchSection('functions')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Funciones
        </a>
        <a class="admin-sidebar-link" data-section="rooms" onclick="switchSection('rooms')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Salas
        </a>
        <a class="admin-sidebar-link" data-section="reservations" onclick="switchSection('reservations')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-2 4h12z"/></svg>
          Reservas
        </a>
        <a class="admin-sidebar-link" data-section="purchases" onclick="switchSection('purchases')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Compras
        </a>
        <a class="admin-sidebar-link" data-section="ratings" onclick="switchSection('ratings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Valoraciones
        </a>
      </aside>

      <div class="admin-content">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('admin-sidebar').classList.toggle('open')" style="margin-bottom:1rem;display:none" id="sidebar-toggle">☰ Menú</button>

        <div id="admin-sections">
          <div id="section-dashboard"></div>
          <div id="section-functions" style="display:none"></div>
          <div id="section-rooms" style="display:none"></div>
          <div id="section-reservations" style="display:none"></div>
          <div id="section-purchases" style="display:none"></div>
          <div id="section-ratings" style="display:none"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="admin-modal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" onclick="closeAdminModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <footer style="padding:2rem;text-align:center;color:var(--on-background-dim);font-size:0.8rem;border-top:1px solid rgba(255,255,255,0.05);">
    <p>&copy; 2026 CINEMA PREMIUM - Panel Administrativo</p>
  </footer>
<script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.init();
    updateNavAuth();
    setupMobileNav();
    setupNavbarScroll();

    if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
      window.location.href = 'login.html';
    }

    let adminData = { rooms: [], functions: [], reservations: [], purchases: [], ratings: [] };

    async function loadAdminData() {
      try {
        const [rooms, functions, reservations, purchases, ratings, tickets] = await Promise.all([
          API.getRooms(),
          API.getFunctions(),
          API.getReservations(),
          API.getPurchases(),
          API.getRatings(),
          API.getTickets()
        ]);
        adminData = { rooms, functions, reservations, purchases, ratings, tickets };
        loadDashboard();
      } catch (err) {
        console.error('Admin data error:', err);
      }
    }

    function switchSection(section) {
      document.querySelectorAll('.admin-sidebar-link').forEach(l => l.classList.remove('active'));
      document.querySelector(`[data-section="${section}"]`).classList.add('active');
      document.querySelectorAll('#admin-sections > div').forEach(d => d.style.display = 'none');
      document.getElementById(`section-${section}`).style.display = 'block';

      if (section === 'dashboard') loadDashboard();
      else if (section === 'functions') loadFunctionsAdmin();
      else if (section === 'rooms') loadRoomsAdmin();
      else if (section === 'reservations') loadReservationsAdmin();
      else if (section === 'purchases') loadPurchasesAdmin();
      else if (section === 'ratings') loadRatingsAdmin();

      document.getElementById('admin-sidebar').classList.remove('open');
    }

    function loadDashboard() {
      const totalRevenue = adminData.purchases.reduce((s, p) => s + p.total, 0);
      const occupiedSeats = adminData.purchases.reduce((s, p) => s + p.quantity, 0) + adminData.reservations.reduce((s, r) => s + r.quantity, 0);
      const todayFunctions = adminData.functions.filter(f => f.date === new Date().toISOString().split('T')[0]);

      document.getElementById('section-dashboard').innerHTML = `
        <div class="admin-page-header">
          <h1 class="admin-page-title">Dashboard</h1>
        </div>
        <div class="admin-stats">
          <div class="admin-stat-card">
            <div class="admin-stat-icon" style="background:rgba(229,9,20,0.15)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-2 4h12z"/></svg>
            </div>
            <div>
              <div class="admin-stat-value">${adminData.functions.length}</div>
              <div class="admin-stat-label">Funciones</div>
            </div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-icon" style="background:rgba(0,114,215,0.15)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--tertiary-container)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
            </div>
            <div>
              <div class="admin-stat-value">${todayFunctions.length}</div>
              <div class="admin-stat-label">Funciones Hoy</div>
            </div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-icon" style="background:rgba(255,152,0,0.15)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--seat-reserved)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </div>
            <div>
              <div class="admin-stat-value">${adminData.reservations.length}</div>
              <div class="admin-stat-label">Reservas</div>
            </div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-icon" style="background:rgba(76,175,80,0.15)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--seat-available)" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </div>
            <div>
              <div class="admin-stat-value">${adminData.purchases.length}</div>
              <div class="admin-stat-label">Compras</div>
            </div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-icon" style="background:rgba(255,215,0,0.15)">
              <svg viewBox="0 0 24 24" fill="#ffd700" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </div>
            <div>
              <div class="admin-stat-value">${adminData.ratings.length}</div>
              <div class="admin-stat-label">Valoraciones</div>
            </div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-icon" style="background:rgba(229,9,20,0.15)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <div>
              <div class="admin-stat-value">${formatCurrency(totalRevenue)}</div>
              <div class="admin-stat-label">Ingresos</div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadFunctionsAdmin() {
      const [functions, rooms] = await Promise.all([API.getFunctions(), API.getRooms()]);
      let movieCache = {};

      let rows = '';
      for (const func of functions) {
        if (!movieCache[func.movieId]) {
          try {
            movieCache[func.movieId] = await TMDB.getMovieDetails(func.movieId);
          } catch {
            movieCache[func.movieId] = { title: `Movie #${func.movieId}` };
          }
        }
        const movie = movieCache[func.movieId];
        const room = rooms.find(r => r.id === func.roomId);
        rows += `<tr>
          <td>${func.id}</td>
          <td>${movie.title}</td>
          <td>${room ? room.name : 'N/A'}</td>
          <td>${formatDate(func.date)}</td>
          <td>${func.time}</td>
          <td>${formatCurrency(func.price)}</td>
          <td>
            <div class="table-actions">
              <button class="table-btn edit" title="Editar" onclick="editFunction(${func.id})">✏️</button>
              <button class="table-btn delete" title="Eliminar" onclick="deleteFunction(${func.id})">🗑️</button>
            </div>
          </td>
        </tr>`;
      }

      document.getElementById('section-functions').innerHTML = `
        <div class="admin-page-header">
          <h1 class="admin-page-title">Gestión de Funciones</h1>
          <button class="btn btn-primary btn-sm" onclick="createFunction()">+ Nueva Función</button>
        </div>
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Película</th><th>Sala</th><th>Fecha</th><th>Hora</th><th>Precio</th><th>Acciones</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    async function createFunction() {
      const rooms = await API.getRooms();
      document.getElementById('modal-title').textContent = 'Crear Función';
      document.getElementById('modal-body').innerHTML = `
        <div class="form-group"><label>Película (TMDB ID)</label><input type="number" id="func-movieId" placeholder="Ej: 550"></div>
        <div class="form-group"><label>Sala</label><select id="func-roomId">${rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('')}</select></div>
        <div class="form-row">
          <div class="form-group"><label>Fecha</label><input type="date" id="func-date"></div>
          <div class="form-group"><label>Hora</label><input type="time" id="func-time"></div>
        </div>
        <div class="form-group"><label>Precio</label><input type="number" id="func-price" placeholder="12000"></div>
      `;
      document.getElementById('modal-footer').innerHTML = '<button class="btn btn-secondary btn-sm" onclick="closeAdminModal()">Cancelar</button><button class="btn btn-primary btn-sm" onclick="saveFunction()">Guardar</button>';
      openAdminModal();
    }

    async function saveFunction() {
      const data = {
        movieId: parseInt(document.getElementById('func-movieId').value),
        roomId: parseInt(document.getElementById('func-roomId').value),
        date: document.getElementById('func-date').value,
        time: document.getElementById('func-time').value,
        price: parseInt(document.getElementById('func-price').value)
      };
      if (!data.movieId || !data.date || !data.time || !data.price) {
        showToast('Completa todos los campos', 'warning');
        return;
      }
      await API.createFunction(data);
      closeAdminModal();
      showToast('Función creada', 'success');
      loadAdminData();
      switchSection('functions');
    }

    async function deleteFunction(id) {
      if (!confirm('¿Eliminar esta función?')) return;
      await API.deleteFunction(id);
      showToast('Función eliminada', 'success');
      loadAdminData();
      switchSection('functions');
    }

    async function loadRoomsAdmin() {
      const rooms = await API.getRooms();
      let rows = '';
      for (const room of rooms) {
        const seats = await API.getSeats(room.id);
        rows += `<tr>
          <td>${room.id}</td>
          <td>${room.name}</td>
          <td>${room.capacity}</td>
          <td><span class="badge badge-info">${room.type}</span></td>
          <td>${seats.length}</td>
          <td>
            <div class="table-actions">
              <button class="table-btn edit" title="Editar" onclick="editRoom(${room.id})">✏️</button>
              <button class="table-btn delete" title="Eliminar" onclick="deleteRoom(${room.id})">🗑️</button>
            </div>
          </td>
        </tr>`;
      }

      document.getElementById('section-rooms').innerHTML = `
        <div class="admin-page-header">
          <h1 class="admin-page-title">Gestión de Salas</h1>
          <button class="btn btn-primary btn-sm" onclick="createRoom()">+ Nueva Sala</button>
        </div>
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Nombre</th><th>Capacidad</th><th>Tipo</th><th>Asientos</th><th>Acciones</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function createRoom() {
      document.getElementById('modal-title').textContent = 'Crear Sala';
      document.getElementById('modal-body').innerHTML = `
        <div class="form-group"><label>Nombre</label><input type="text" id="room-name" placeholder="Sala 5"></div>
        <div class="form-group"><label>Capacidad</label><input type="number" id="room-capacity" placeholder="48"></div>
        <div class="form-group"><label>Tipo</label><select id="room-type"><option value="standard">Standard</option><option value="3D">3D</option><option value="VIP">VIP</option></select></div>
      `;
      document.getElementById('modal-footer').innerHTML = '<button class="btn btn-secondary btn-sm" onclick="closeAdminModal()">Cancelar</button><button class="btn btn-primary btn-sm" onclick="saveRoom()">Guardar</button>';
      openAdminModal();
    }

    async function saveRoom() {
      const name = document.getElementById('room-name').value.trim();
      const capacity = parseInt(document.getElementById('room-capacity').value);
      const type = document.getElementById('room-type').value;
      if (!name || !capacity) { showToast('Completa todos los campos', 'warning'); return; }
      await API.createRoom({ name, capacity, type });
      closeAdminModal();
      showToast('Sala creada', 'success');
      loadAdminData();
      switchSection('rooms');
    }

    async function deleteRoom(id) {
      if (!confirm('¿Eliminar esta sala?')) return;
      await API.deleteRoom(id);
      showToast('Sala eliminada', 'success');
      loadAdminData();
      switchSection('rooms');
    }

    function editRoom(id) { showToast('Edición de sala (funcionalidad extendida)', 'info'); }
    function editFunction(id) { showToast('Edición de función (funcionalidad extendida)', 'info'); }

    async function loadReservationsAdmin() {
      const [reservations, functions, rooms] = await Promise.all([API.getReservations(), API.getFunctions(), API.getRooms()]);
      let movieCache = {};
      let rows = '';

      for (const res of reservations) {
        const func = functions.find(f => f.id === res.functionId);
        if (!func) continue;
        if (!movieCache[func.movieId]) {
          try { movieCache[func.movieId] = await TMDB.getMovieDetails(func.movieId); } catch { movieCache[func.movieId] = { title: `#${func.movieId}` }; }
        }
        const room = rooms.find(r => r.id === func.roomId);
        rows += `<tr>
          <td>${res.id}</td>
          <td>${res.userId}</td>
          <td>${movieCache[func.movieId].title}</td>
          <td>${formatDate(func.date)} ${func.time}</td>
          <td>${room ? room.name : 'N/A'}</td>
          <td>${res.quantity}</td>
          <td>${formatCurrency(res.total)}</td>
          <td><span class="badge badge-${res.status === 'confirmed' ? 'success' : 'warning'}">${res.status}</span></td>
        </tr>`;
      }

      document.getElementById('section-reservations').innerHTML = `
        <div class="admin-page-header"><h1 class="admin-page-title">Reservas</h1></div>
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Usuario</th><th>Película</th><th>Función</th><th>Sala</th><th>Cant.</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    async function loadPurchasesAdmin() {
      const [purchases, functions, rooms] = await Promise.all([API.getPurchases(), API.getFunctions(), API.getRooms()]);
      let movieCache = {};
      let rows = '';

      for (const pur of purchases) {
        const func = functions.find(f => f.id === pur.functionId);
        if (!func) continue;
        if (!movieCache[func.movieId]) {
          try { movieCache[func.movieId] = await TMDB.getMovieDetails(func.movieId); } catch { movieCache[func.movieId] = { title: `#${func.movieId}` }; }
        }
        const room = rooms.find(r => r.id === func.roomId);
        rows += `<tr>
          <td>${pur.id}</td>
          <td>${pur.buyerName || 'N/A'}</td>
          <td>${movieCache[func.movieId].title}</td>
          <td>${formatDate(func.date)} ${func.time}</td>
          <td>${room ? room.name : 'N/A'}</td>
          <td>${pur.quantity}</td>
          <td>${formatCurrency(pur.total)}</td>
          <td><span class="badge badge-success">${pur.status}</span></td>
        </tr>`;
      }

      document.getElementById('section-purchases').innerHTML = `
        <div class="admin-page-header"><h1 class="admin-page-title">Compras</h1></div>
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Cliente</th><th>Película</th><th>Función</th><th>Sala</th><th>Cant.</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    async function loadRatingsAdmin() {
      const ratings = await API.getRatings();
      let movieCache = {};
      let rows = '';

      for (const r of ratings) {
        if (!movieCache[r.movieId]) {
          try { movieCache[r.movieId] = await TMDB.getMovieDetails(r.movieId); } catch { movieCache[r.movieId] = { title: `#${r.movieId}` }; }
        }
        rows += `<tr>
          <td>${r.id}</td>
          <td>${r.userId}</td>
          <td>${movieCache[r.movieId].title}</td>
          <td>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td>
          <td>${r.comment || '-'}</td>
        </tr>`;
      }

      document.getElementById('section-ratings').innerHTML = `
        <div class="admin-page-header"><h1 class="admin-page-title">Valoraciones</h1></div>
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Usuario</th><th>Película</th><th>Rating</th><th>Comentario</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function openAdminModal() {
      const modal = document.getElementById('admin-modal');
      modal.style.display = 'flex';
      requestAnimationFrame(() => modal.classList.add('active'));
    }

    function closeAdminModal() {
      const modal = document.getElementById('admin-modal');
      modal.classList.remove('active');
      setTimeout(() => modal.style.display = 'none', 300);
    }

    // Mobile sidebar toggle
    if (window.innerWidth <= 1024) {
      document.getElementById('sidebar-toggle').style.display = 'block';
    }

    loadAdminData();
  </script>
</body>
</html>
