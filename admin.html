<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CINEMA</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cartelera.html">Cartelera</a></li>
      <li><a href="mis-entradas.html">Mis Entradas</a></li>
      <li><a href="mi-lista.html">Mi Lista</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-user-area"></div>
      <button class="nav-mobile-toggle">&#9776;</button>
    </div>
  </nav>

  <main class="page-content">
    <div class="admin-layout">
      <aside class="admin-sidebar" id="admin-sidebar">
        <a class="admin-sidebar-link active" data-section="dashboard" onclick="switchSection('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="admin-sidebar-link" data-section="functions" onclick="switchSection('functions')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Funciones
        </a>
        <a class="admin-sidebar-link" data-section="rooms" onclick="switchSection('rooms')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Salas
        </a>
        <a class="admin-sidebar-link" data-section="reservations" onclick="switchSection('reservations')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-2 4h12z"/></svg>
          Reservas
        </a>
        <a class="admin-sidebar-link" data-section="purchases" onclick="switchSection('purchases')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Compras
        </a>
        <a class="admin-sidebar-link" data-section="ratings" onclick="switchSection('ratings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Valoraciones
        </a>
      </aside>

      <div class="admin-content">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('admin-sidebar').classList.toggle('open')" style="margin-bottom:1rem;display:none" id="sidebar-toggle">☰ Menú</button>

        <div id="admin-sections">
          <div id="section-dashboard"></div>
          <div id="section-functions" style="display:none"></div>
          <div id="section-rooms" style="display:none"></div>
          <div id="section-reservations" style="display:none"></div>
          <div id="section-purchases" style="display:none"></div>
          <div id="section-ratings" style="display:none"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="admin-modal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" onclick="closeAdminModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <footer style="padding:2rem;text-align:center;color:var(--on-background-dim);font-size:0.8rem;border-top:1px solid rgba(255,255,255,0.05);">
    <p>&copy; 2026 CINEMA PREMIUM - Panel Administrativo</p>
  </footer>
<script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
