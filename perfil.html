<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CINEMA</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cartelera.html">Cartelera</a></li>
      <li><a href="mis-entradas.html">Mis Entradas</a></li>
      <li><a href="mi-lista.html">Mi Lista</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-user-area"></div>
      <button class="nav-mobile-toggle">&#9776;</button>
    </div>
  </nav>

  <main class="page-content">
    <div class="container" style="max-width:800px">
      <div id="profile-content" style="padding:2rem 0">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <footer style="padding:2rem;text-align:center;color:var(--on-background-dim);font-size:0.8rem;border-top:1px solid rgba(255,255,255,0.05);">
    <p>&copy; 2026 CINEMA PREMIUM. Todos los derechos reservados.</p>
  </footer>
<script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.init();
    updateNavAuth();
    setupMobileNav();
    setupNavbarScroll();

    if (!Auth.isLoggedIn()) {
      window.location.href = 'login.html?redirect=perfil.html';
    }

    async function loadProfile() {
      const user = Auth.getUser();
      if (!user) return;

      const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

      try {
        const [tickets, reservations, favorites, ratings, activitySummary] = await Promise.all([
          API.getTicketsByUser(user.id),
          API.getReservationsByUser(user.id),
          API.getFavorites(user.id),
          API.getRatingsByUser(user.id),
          API.getActivitySummary(user.id)
        ]);

        document.getElementById('profile-content').innerHTML = `
          <div class="profile-header">
            <div class="profile-avatar">${initials}</div>
            <div class="profile-info">
              <h2>${user.name}</h2>
              <p>${user.email}</p>
              <p style="font-size:0.8rem;margin-top:0.3rem"><span class="badge badge-info">${user.role}</span></p>
            </div>
          </div>

          <div class="admin-stats" style="margin-bottom:2rem">
            <div class="admin-stat-card">
              <div class="admin-stat-icon" style="background:rgba(229,9,20,0.15)">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-2 4h12z"/></svg>
              </div>
              <div>
                <div class="admin-stat-value">${activitySummary.compras}</div>
                <div class="admin-stat-label">Compras</div>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon" style="background:rgba(0,114,215,0.15)">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--tertiary-container)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
              </div>
              <div>
                <div class="admin-stat-value">${activitySummary.reservas}</div>
                <div class="admin-stat-label">Reservas</div>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon" style="background:rgba(76,175,80,0.15)">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--seat-available)" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </div>
              <div>
                <div class="admin-stat-value">${activitySummary.peliculasVistas}</div>
                <div class="admin-stat-label">Peliculas Vistas</div>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon" style="background:rgba(255,107,107,0.15)">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </div>
              <div>
                <div class="admin-stat-value">${activitySummary.favoritos}</div>
                <div class="admin-stat-label">Favoritos</div>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon" style="background:rgba(255,215,0,0.15)">
                <svg viewBox="0 0 24 24" fill="#ffd700" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              </div>
              <div>
                <div class="admin-stat-value">${activitySummary.valoraciones}</div>
                <div class="admin-stat-label">Valoraciones</div>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon" style="background:rgba(255,152,0,0.15)">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--seat-reserved)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </div>
              <div>
                <div class="admin-stat-value">${activitySummary.busquedas}</div>
                <div class="admin-stat-label">Busquedas</div>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem">
            <a href="mis-entradas.html" class="btn btn-secondary">Mis Entradas</a>
            <a href="mi-lista.html" class="btn btn-secondary">Mi Lista</a>
            ${user.role === 'admin' ? '<a href="admin.html" class="btn btn-primary">Panel Admin</a>' : ''}
            <button class="btn btn-outline" onclick="Auth.logout()" style="color:var(--accent-red);border-color:var(--accent-red)">Cerrar Sesión</button>
          </div>
        `;
      } catch (err) {
        document.getElementById('profile-content').innerHTML = renderEmptyState('Error al cargar el perfil');
      }
    }

    loadProfile();
  </script>
</body>
</html>
