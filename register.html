<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">CINEMA</div>
      <h2 class="auth-title">Crear Cuenta</h2>
      <p class="auth-subtitle">Únete a CINEMA PREMIUM</p>

      <div class="auth-error" id="register-error"></div>

      <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="reg-name" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirmar contraseña</label>
          <input type="password" id="reg-confirm" placeholder="Repite tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary">Crear Cuenta</button>
      </form>

      <div class="auth-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
      <div class="auth-link" style="margin-top:0.5rem">
        <a href="index.html">Volver al inicio</a>
      </div>
    </div>
  </div>
<script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
