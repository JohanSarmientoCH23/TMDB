<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">CINEMA</div>
      <h2 class="auth-title">Crear Cuenta</h2>
      <p class="auth-subtitle">Únete a CINEMA PREMIUM</p>

      <div class="auth-error" id="register-error"></div>

      <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="reg-name" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirmar contraseña</label>
          <input type="password" id="reg-confirm" placeholder="Repite tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary">Crear Cuenta</button>
      </form>

      <div class="auth-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
      <div class="auth-link" style="margin-top:0.5rem">
        <a href="index.html">Volver al inicio</a>
      </div>
    </div>
  </div>
<script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.init();

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const errorEl = document.getElementById('register-error');

      if (!name || !email || !password) {
        errorEl.textContent = 'Completa todos los campos';
        errorEl.classList.add('show');
        return;
      }

      if (password !== confirm) {
        errorEl.textContent = 'Las contraseñas no coinciden';
        errorEl.classList.add('show');
        return;
      }

      if (password.length < 6) {
        errorEl.textContent = 'La contrasena debe tener al menos 6 caracteres';
        errorEl.classList.add('show');
        return;
      }

      // Validar nombre y correo duplicados
      const users = API.getUsers();
      if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
        errorEl.textContent = 'Este correo ya esta registrado';
        errorEl.classList.add('show');
        return;
      }
      if (users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
        errorEl.textContent = 'Este nombre de usuario ya existe';
        errorEl.classList.add('show');
        return;
      }

      try {
        const user = await Auth.register(name, email, password);
        errorEl.classList.remove('show');
        showToast(`Cuenta creada. Bienvenido, ${user.name}`, 'success');
        setTimeout(() => {
          window.location.href = getParam('redirect') || 'index.html';
        }, 500);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      }
    }
  </script>
</body>
</html>
