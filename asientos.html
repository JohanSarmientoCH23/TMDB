<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Asientos - CINEMA PREMIUM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CINEMA</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cartelera.html">Cartelera</a></li>
      <li><a href="mis-entradas.html">Mis Entradas</a></li>
      <li><a href="mi-lista.html">Mi Lista</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-user-area"></div>
      <button class="nav-mobile-toggle">&#9776;</button>
    </div>
  </nav>

  <main class="page-content">
    <div class="container">
      <div class="section-header" style="padding-top:2rem">
        <div>
          <h2 class="section-title">Selecciona tus Asientos</h2>
          <p class="section-subtitle" id="seat-subtitle"></p>
        </div>
      </div>

      <div class="seat-layout-grid" id="seat-layout">
        <div id="seat-map-area">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
        <div id="summary-panel"></div>
      </div>
    </div>
  </main>

  <footer style="padding:2rem;text-align:center;color:var(--on-background-dim);font-size:0.8rem;border-top:1px solid rgba(255,255,255,0.05);margin-top:2rem;">
    <p>&copy; 2026 CINEMA PREMIUM. Todos los derechos reservados.</p>
  </footer>
<script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.init();
    updateNavAuth();
    setupMobileNav();
    setupNavbarScroll();

    const functionId = parseInt(getParam('functionId'));
    let funcData = null;
    let roomData = null;
    let movieData = null;
    let allSeats = [];
    let functionSeats = [];
    let selectedSeats = [];

    async function loadSeats() {
      if (!functionId) {
        document.getElementById('seat-map-area').innerHTML = renderEmptyState('No se especificó una función');
        return;
      }

      try {
        funcData = await API.getFunction(functionId);
        roomData = await API.getRoom(funcData.roomId);
        movieData = await TMDB.getMovieDetails(funcData.movieId);
        allSeats = await API.getSeats(funcData.roomId);
        functionSeats = await API.getFunctionSeats(functionId);

        document.getElementById('seat-subtitle').textContent =
          `${movieData.title} • ${roomData.name} • ${formatDate(funcData.date)} ${funcData.time}`;

        renderSeatMap();
        renderSummary();
      } catch (err) {
        document.getElementById('seat-map-area').innerHTML = renderEmptyState('Error al cargar los asientos');
      }
    }

    function renderSeatMap() {
      const rows = {};
      allSeats.forEach(seat => {
        if (!rows[seat.row]) rows[seat.row] = [];
        rows[seat.row].push(seat);
      });

      const sortedRows = Object.keys(rows).sort();

      let html = `
        <div class="seat-map-container">
          <div class="seat-screen">PANTALLA</div>
          <div class="seat-rows">
      `;

      sortedRows.forEach(rowLabel => {
        const rowSeats = rows[rowLabel].sort((a, b) => a.number - b.number);
        html += `<div class="seat-row"><span class="seat-row-label">${rowLabel}</span>`;
        rowSeats.forEach(seat => {
          const fSeat = functionSeats.find(fs => fs.seatId === seat.id);
          const status = fSeat ? fSeat.status : 'available';
          const seatClass = `seat seat-${status}`;
          const disabled = status === 'sold' || status === 'reserved' ? 'disabled' : '';
          const tooltip = `${seat.seatCode} - ${seat.location} (${seat.type})`;
          html += `<div class="${seatClass}" data-seat-id="${seat.id}" data-status="${status}" data-code="${seat.seatCode}" data-row="${seat.row}" data-number="${seat.number}" data-location="${seat.location}" data-type="${seat.type}" title="${tooltip}" onclick="toggleSeat(this)">${seat.number}</div>`;
        });
        html += `<span class="seat-row-label">${rowLabel}</span></div>`;
      });

      html += `
          </div>
          <div class="seat-legend">
            <div class="seat-legend-item"><div class="seat-legend-dot available"></div>Disponible</div>
            <div class="seat-legend-item"><div class="seat-legend-dot selected"></div>Seleccionado</div>
            <div class="seat-legend-item"><div class="seat-legend-dot reserved"></div>Reservado</div>
            <div class="seat-legend-item"><div class="seat-legend-dot sold"></div>Vendido</div>
          </div>
        </div>
      `;

      document.getElementById('seat-map-area').innerHTML = html;
    }

    function toggleSeat(el) {
      const status = el.dataset.status;
      if (status === 'sold' || status === 'reserved') {
        showToast('Este asiento no está disponible', 'warning');
        return;
      }

      const seatId = parseInt(el.dataset.seatId);
      const seatCode = el.dataset.code;
      const seatRow = el.dataset.row;
      const seatNumber = el.dataset.number;
      const seatLocation = el.dataset.location;
      const seatType = el.dataset.type;

      const idx = selectedSeats.findIndex(s => s.seatId === seatId);
      if (idx >= 0) {
        selectedSeats.splice(idx, 1);
        el.className = 'seat seat-available';
        el.dataset.status = 'available';
      } else {
        selectedSeats.push({ seatId, seatCode, row: seatRow, number: seatNumber, location: seatLocation, type: seatType });
        el.className = 'seat seat-selected';
        el.dataset.status = 'selected';
      }

      renderSummary();
    }

    function renderSummary() {
      const count = selectedSeats.length;
      const total = count * funcData.price;

      document.getElementById('summary-panel').innerHTML = `
        <div class="purchase-summary">
          <h3>Resumen de Compra</h3>
          <div class="summary-row"><span class="summary-label">Película</span><span>${movieData.title}</span></div>
          <div class="summary-row"><span class="summary-label">Fecha</span><span>${formatDate(funcData.date)}</span></div>
          <div class="summary-row"><span class="summary-label">Hora</span><span>${funcData.time}</span></div>
          <div class="summary-row"><span class="summary-label">Sala</span><span>${roomData.name} (${roomData.type})</span></div>
          <div class="summary-row">
            <span class="summary-label">Asientos</span>
            <span>${count}</span>
          </div>
          ${count > 0 ? `
          <div class="selected-seats-list">
            ${selectedSeats.map(s => `<span class="seat-tag">${s.seatCode}</span>`).join('')}
          </div>` : ''}
          <div class="summary-row"><span class="summary-label">Precio unitario</span><span>${formatCurrency(funcData.price)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatCurrency(total)}</span></div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:1.5rem" onclick="proceedToCheckout()" ${count === 0 ? 'disabled' : ''}>Continuar</button>
          ${count === 0 ? '<p style="text-align:center;font-size:0.8rem;color:var(--on-background-dim);margin-top:0.8rem">Selecciona al menos un asiento</p>' : ''}
        </div>
      `;
    }

    function proceedToCheckout() {
      if (!Auth.isLoggedIn()) {
        showToast('Inicia sesión para continuar', 'warning');
        window.location.href = `login.html?redirect=asientos.html?functionId=${functionId}`;
        return;
      }
      if (selectedSeats.length === 0) {
        showToast('Selecciona al menos un asiento', 'warning');
        return;
      }
      showActionChoice();
    }

    function showActionChoice() {
      const total = selectedSeats.length * funcData.price;
      const seatsList = selectedSeats.map(s => `<span class="seat-tag">${s.seatCode}</span>`).join('');

      const content = `
        <div style="text-align:center;margin-bottom:1.5rem">
          <p style="color:var(--on-background-dim);margin-top:0.5rem">¿Qué deseas hacer con ${selectedSeats.length} entrada${selectedSeats.length > 1 ? 's' : ''}?</p>
          <div class="selected-seats-list" style="justify-content:center;margin-top:0.8rem">${seatsList}</div>
          <p style="font-size:1.1rem;font-weight:600;margin-top:0.8rem;color:var(--primary)">Total: ${formatCurrency(total)}</p>
        </div>
        <div class="action-choice-grid">
          <button class="action-choice-card" onclick="goToReserve()">
            <div class="action-choice-icon">🎟️</div>
            <h3>Reservar</h3>
            <p>Reserva tus asientos y paga en el local</p>
            <span class="action-choice-note">Sin pago en línea</span>
          </button>
          <button class="action-choice-card" onclick="goToPurchase()">
            <div class="action-choice-icon">💳</div>
            <h3>Comprar</h3>
            <p>Paga ahora y recibe tu ticket digital</p>
            <span class="action-choice-note">Pago en línea</span>
          </button>
        </div>
      `;
      showModal('¿Qué desea hacer?', content);
    }

    function storeSelection() {
      return {
        functionId,
        movieId: funcData.movieId,
        movieTitle: movieData.title,
        seats: selectedSeats,
        roomName: roomData.name,
        roomType: roomData.type,
        date: funcData.date,
        time: funcData.time,
        price: funcData.price,
        total: selectedSeats.length * funcData.price
      };
    }

    function goToPurchase() {
      closeModal();
      sessionStorage.setItem('cinema_checkout', JSON.stringify(storeSelection()));
      window.location.href = 'checkout.html';
    }

    function goToReserve() {
      closeModal();
      sessionStorage.setItem('cinema_reservation', JSON.stringify(storeSelection()));
      window.location.href = 'reservar.html';
    }

    loadSeats();
  </script>
</body>
</html>
